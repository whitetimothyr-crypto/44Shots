name: Backfill Audit Issues

# One-shot manual workflow to seed known-issue tracker entries that pre-dated
# the create-issues automation. Idempotent: checks existing open issues by
# exact title before creating. Safe to re-run.

on:
  workflow_dispatch:

jobs:
  backfill:
    name: Backfill known audit findings
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Backfill — missing security headers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="[Audit Finding] Security: missing security headers on production"
          EXISTING=$(gh issue list \
            --label "audit-finding" \
            --state open \
            --limit 100 \
            --json number,title \
            --repo "$REPO" | jq -r --arg t "$TITLE" '.[] | select(.title==$t) | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Skipping — issue #$EXISTING already open with this title."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --label "audit-finding,severity:critical,source:security" \
            --repo "$REPO" \
            --body-file - <<'EOF'
          Production audit on commit 65d3305 detected missing security headers on https://44shots.com:
          - x-content-type-options (MISSING)
          - x-frame-options (MISSING)
          - referrer-policy (MISSING)
          - strict-transport-security (PRESENT — good)

          **Root cause:** vercel.json has no headers block.

          **Fix:** add a headers block to vercel.json mapping source `/(.*)` to:
          - Strict-Transport-Security: max-age=31536000; includeSubDomains
          - X-Content-Type-Options: nosniff
          - X-Frame-Options: DENY
          - Referrer-Policy: strict-origin-when-cross-origin

          **Verify after fix:** npm run audit:security
          EOF

      - name: Backfill — AWS Secret Key regex false positive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="[Audit Finding] Security: AWS Secret Key regex false positive"
          EXISTING=$(gh issue list \
            --label "audit-finding" \
            --state open \
            --limit 100 \
            --json number,title \
            --repo "$REPO" | jq -r --arg t "$TITLE" '.[] | select(.title==$t) | .number' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Skipping — issue #$EXISTING already open with this title."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --label "audit-finding,severity:serious,source:security" \
            --repo "$REPO" \
            --body-file - <<'EOF'
          Audit security spec produces a false positive on the AWS Secret Key pattern. Matches 40-char strings of mixed dividers + padding (e.g. "==================== abc12345..."), which appear in bundled code as base64 padding or comment dividers.

          **Root cause:** regex `/(?<![A-Za-z0-9/+=])[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])/` accepts strings with no alphanumeric prefix.

          **Fix options:**
          - A: Add structural floor (require alphanumeric start): prefix `(?=[A-Za-z0-9])` to the regex
          - B: Replace with AWS-specific heuristic that excludes pure-padding sequences

          **Workaround for now:** when this test fails, manually inspect matched string. If it starts with "=" or contains divider patterns, false positive.

          **Reference:** docs/audit-known-issues.md
          EOF
