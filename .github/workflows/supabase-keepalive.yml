name: Supabase keep-alive

# Free-tier Supabase projects pause after 1 week of inactivity.
# This pings the public REST endpoint every 2 days to keep it awake.
on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase (nomos_game, 1 row)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://qshgschhudiryjnslzof.supabase.co/rest/v1/nomos_game?select=id&limit=1" \
            -H "apikey: sb_publishable_hdrc9mYaGocDhJVesn0FRw_wELl6Tnv")
          echo "HTTP $code"
          test "$code" = "200"
