<!DOCTYPE html>

<title>Felix Tracker</title>
<style>
  /* [Surgical Injection: Viewer Styles] */
  #safeViewer {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 99999; flex-direction: column;
  }
  #safeViewer.active { display: flex; }
  #viewerNav {
    padding: 60px 20px 20px; background: #151b2d;
    display: flex; justify-content: space-between; align-items: center;
  }
  .back-to-app-btn {
    background: #ef4444; color: white; border: none; padding: 12px 20px;
    border-radius: 8px; font-weight: bold; cursor: pointer;
  }
  #viewerIframe { flex: 1; border: none; width: 100%; background: white; }

  /* --- ALL YOUR ORIGINAL CSS REMAINS BELOW --- */
  :root { --bg: #0a0e1a; --card: #151b2d; --accent: #3b82f6; --text: #e2e8f0; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; height: 100vh; }
  /* (Your original styles for tabs, help, and rink stay here) */

</head>
<body>

<div id="app">
  <div id="rink-container" onclick="handleTap(event)">
      </div>
</div>

<div id="safeViewer">
  <div id="viewerNav">
    <button class="back-to-app-btn" onclick="closeViewer()">← BACK TO TRACKER</button>
    <span style="font-weight:bold; color:white;">File Preview</span>
    <div style="width:40px"></div>
  </div>
  <iframe id="viewerIframe"></iframe>
</div>

<script>
  /* --- THE VIBE-CODING SURGERY --- */

  let isRotated = false;

  // FIX 1: The Shot Registration Bug
  function handleTap(e) {
    const rink = document.getElementById('rink-container');
    const rect = rink.getBoundingClientRect();
    
    // Percent-based coordinate
    let x = ((e.clientX - rect.left) / rect.width) * 100;
    let y = ((e.clientY - rect.top) / rect.height) * 100;

    // The Magic Math for rotation
    if (isRotated) {
        let oldX = x;
        x = y; 
        y = 100 - oldX;
    }

    // Call YOUR original marker function (make sure the name matches yours)
    if (typeof addMarker === "function") {
        addMarker(x, y);
    }
  }

  // Use this for your "Rotate View" button
  function toggleRinkRotation() {
    isRotated = !isRotated;
    const rink = document.getElementById('rink-container');
    rink.style.transform = isRotated ? 'rotate(90deg)' : 'rotate(0deg)';
  }

  // FIX 2: The PDF/Image Trap
  // Call this instead of window.location for your reports!
  function viewExportSafely(url) {
    const viewer = document.getElementById('safeViewer');
    const frame = document.getElementById('viewerIframe');
    frame.src = url;
    viewer.classList.add('active');
  }

  function closeViewer() {
    const viewer = document.getElementById('safeViewer');
    const frame = document.getElementById('viewerIframe');
    viewer.classList.remove('active');
    frame.src = "";
  }

  /* --- ALL YOUR ORIGINAL JAVASCRIPT REMAINS BELOW --- */
  // (Paste all your original player data, stats logic, and help tour code here)
</script>
</body>
