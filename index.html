<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0e1a" />
<title>Felix Tracker</title>
<style>
  /* --- I kept all your original styles here --- */
  :root { --bg: #0a0e1a; --card: #151b2d; --accent: #3b82f6; --text: #e2e8f0; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; height: 100vh; }
  
  /* NEW: This is the "Safety Room" for your PDFs so you don't get stuck */
  #exportViewer {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 10000; flex-direction: column;
  }
  #exportViewer.active { display: flex; }
  #viewerHeader {
    padding: 50px 20px 20px; background: var(--card);
    display: flex; justify-content: space-between; align-items: center;
  }
  .back-btn {
    background: #ef4444; color: white; border: none; padding: 12px 20px;
    border-radius: 8px; font-weight: bold; cursor: pointer;
  }
  iframe#viewerFrame { flex-grow: 1; border: none; width: 100%; }

  /* Keep your existing Rink/UI styles below... */
</style>
</head>
<body>

<div id="app">
  <div id="rink-container" onclick="recordShot(event)">
      </div>
</div>

<div id="exportViewer">
  <div id="viewerHeader">
    <button class="back-btn" onclick="closeExport()">← BACK TO TRACKER</button>
    <span style="font-weight:bold">File Preview</span>
    <div style="width:50px"></div>
  </div>
  <iframe id="viewerFrame"></iframe>
</div>

<script>
  let isRotated = false;

  // FIX 1: The "Rotation" Bug
  // This makes sure the dots land under your finger even when rotated
  function recordShot(e) {
    const rink = document.getElementById('rink-container');
    const rect = rink.getBoundingClientRect();
    
    // Where you tapped
    let x = ((e.clientX - rect.left) / rect.width) * 100;
    let y = ((e.clientY - rect.top) / rect.height) * 100;

    // The Magic Math: If it's sideways, swap the numbers
    if (isRotated) {
        let oldX = x;
        x = y; 
        y = 100 - oldX;
    }

    // Now call your original "place the dot" function
    addShotToScreen(x, y); 
  }

  // Your existing button should call this
  function toggleRinkRotation() {
    isRotated = !isRotated;
    const rink = document.getElementById('rink-container');
    rink.style.transform = isRotated ? 'rotate(90deg)' : 'rotate(0deg)';
  }

  // FIX 2: The "Force Close" Bug
  // Instead of opening a PDF and getting stuck, use this function
  function viewFileSafely(url) {
    const viewer = document.getElementById('exportViewer');
    const frame = document.getElementById('viewerFrame');
    frame.src = url;
    viewer.classList.add('active');
  }

  function closeExport() {
    document.getElementById('exportViewer').classList.remove('active');
    document.getElementById('viewerFrame').src = "";
  }

  // VIBE CODING TIP: 
  // Everywhere in your code where you have a button to "Export PDF" or "View Photo",
  // make sure the button calls: viewFileSafely('your-file-link.pdf')
</script>
</body>
</html>
